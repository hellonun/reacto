<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ec">
<title>Reacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f1a17; --cream:#fff8ec; --pink:#ff5d8f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--cream); color:var(--ink);
    font-family:'Baloo 2', system-ui, sans-serif; display:flex; flex-direction:column; align-items:center;
    padding:max(24px, env(safe-area-inset-top)) 16px 32px; }
  h1 { font-size:clamp(44px, 12vw, 80px); margin:10px 0 0; line-height:1; }
  p { font-size:19px; opacity:.7; margin:6px 0 26px; text-align:center; max-width:460px; }
  .list { display:grid; gap:16px; width:100%; max-width:460px; }
  a.card { display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit; background:#ffcc33;
    border:4px solid var(--ink); border-radius:24px; padding:16px 20px; box-shadow:0 6px 0 var(--ink); }
  a.card:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .icon { font-size:46px; line-height:1; }
  .card b { font-size:28px; display:block; line-height:1.1; }
  .card span { font-size:16px; opacity:.75; }
  .soon { background:#fff; opacity:.55; pointer-events:none; }
</style>
</head>
<body>
  <h1>Reacto</h1>
  <p>Build a cardboard creation, pop your phone in, and bring it to life!</p>
  <div class="list">
    <a class="card" href="eyes/">
      <div class="icon">👀</div>
      <div><b>Eyes</b><span>Tilt to look around, shake to get dizzy</span></div>
    </a>
    <a class="card" href="engine/" style="background:#ec6a2c">
      <div class="icon">🏎️</div>
      <div><b>Engine</b><span>Hold to start, hold to VROOM</span></div>
    </a>
    <a class="card soon" href="#">
      <div class="icon">📦</div>
      <div><b>More coming…</b><span>Next creation on the way</span></div>
    </a>
  </div>
</body>
</html>
